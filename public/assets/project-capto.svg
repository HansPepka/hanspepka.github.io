<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4511E"/>
      <stop offset="1" stop-color="#FF8A50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7a1f00" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#fff" opacity="0.07"/>
  <circle cx="120" cy="640" r="260" fill="#fff" opacity="0.06"/>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="250" y="110" width="270" height="480" rx="38" fill="#1F1F23"/>
    <rect x="264" y="124" width="242" height="452" rx="28" fill="#FFF7F3"/>
  </g>
  <rect x="345" y="138" width="80" height="10" rx="5" fill="#1F1F23" opacity="0.15"/>
  <text x="385" y="200" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F23">Nouveau devis</text>
  <text x="385" y="228" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8A8A93">New quote</text>
  <!-- waveform -->
  <g fill="#F4511E">
    <rect x="300" y="300" width="10" height="40" rx="5"/>
    <rect x="318" y="285" width="10" height="70" rx="5"/>
    <rect x="336" y="270" width="10" height="100" rx="5"/>
    <rect x="354" y="292" width="10" height="56" rx="5"/>
    <rect x="372" y="260" width="10" height="120" rx="5"/>
    <rect x="390" y="280" width="10" height="80" rx="5"/>
    <rect x="408" y="268" width="10" height="104" rx="5"/>
    <rect x="426" y="294" width="10" height="52" rx="5"/>
    <rect x="444" y="282" width="10" height="76" rx="5"/>
    <rect x="462" y="302" width="10" height="36" rx="5"/>
  </g>
  <!-- mic button -->
  <circle cx="385" cy="490" r="46" fill="#F4511E"/>
  <circle cx="385" cy="490" r="60" fill="#F4511E" opacity="0.18"/>
  <rect x="373" y="462" width="24" height="38" rx="12" fill="#fff"/>
  <path d="M363 488c0 13 10 23 22 23s22-10 22-23" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="385" y1="511" x2="385" y2="524" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Arrow -->
  <path d="M560 350h110" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <path d="M648 322l30 28-30 28" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quote / invoice document -->
  <g filter="url(#shadow)">
    <rect x="720" y="150" width="300" height="400" rx="22" fill="#fff"/>
  </g>
  <text x="752" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F4511E" letter-spacing="2">DEVIS</text>
  <text x="752" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8A93">Quote · Invoice</text>
  <g fill="#ECECF0">
    <rect x="752" y="268" width="236" height="12" rx="6"/>
    <rect x="752" y="296" width="180" height="12" rx="6"/>
    <rect x="752" y="336" width="236" height="12" rx="6"/>
    <rect x="752" y="364" width="200" height="12" rx="6"/>
    <rect x="752" y="392" width="150" height="12" rx="6"/>
  </g>
  <line x1="752" y1="436" x2="988" y2="436" stroke="#ECECF0" stroke-width="2"/>
  <rect x="752" y="460" width="90" height="14" rx="7" fill="#1F1F23" opacity="0.8"/>
  <rect x="898" y="452" width="90" height="30" rx="15" fill="#F4511E"/>

  <!-- Title -->
  <text x="80" y="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#fff" letter-spacing="-1">Capto</text>
</svg>
